<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password – EHR</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-page">
        <main class="form-panel">
            <section class="login-card">
                <header class="login-header">
                    <h1>Reset your password</h1>
                    <p>Choose a new password for your EHR account.</p>
                </header>

                <div class="password-reset-message" id="resetPasswordMessage" role="status" aria-live="polite"></div>
                <form class="form-fields" id="resetPasswordForm">
                    <div class="field-group">
                        <label for="newPassword">New password</label>
                        <div class="input-wrapper">
                            <input id="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="256" required>
                        </div>
                    </div>
                    <div class="field-group">
                        <label for="confirmNewPassword">Confirm new password</label>
                        <div class="input-wrapper">
                            <input id="confirmNewPassword" type="password" autocomplete="new-password" minlength="8" maxlength="256" required>
                        </div>
                    </div>
                    <p class="password-hint">Use at least 8 characters with an uppercase letter, a lowercase letter, a number, and a symbol.</p>
                    <button class="btn-primary" id="resetPasswordButton" type="submit">Reset password</button>
                </form>

                <a class="forgot-link" href="/Account/Login">Back to sign in</a>
            </section>
            <footer class="form-footer">
                <div class="copyright">
                    <p>&copy; ConsentCare. All clinical actions are digitally signed and recorded.</p>
                </div>
            </footer>
        </main>
    </div>
    <script src="/js/Login.js"></script>
</body>
</html>
